name: coinjoin-analysis

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Set the repository variable CI_RUNNER to a JSON array of runner labels
    # (for example ["self-hosted","x64"]) in repositories with a local runner.
    # Leave it unset in upstream to use GitHub's hosted Ubuntu runner.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Graphviz on GitHub-hosted runner
      if: ${{ runner.environment == 'github-hosted' }}
      run: sudo apt-get update && sudo apt-get install -y graphviz

    - name: Check Graphviz on self-hosted runner
      if: ${{ runner.environment == 'self-hosted' }}
      shell: bash
      run: |
        if ! command -v dot >/dev/null 2>&1; then
          echo "::error::Graphviz must be installed on the self-hosted runner."
          exit 1
        fi

    - name: Set up test environment
      shell: bash
      run: |
        python -m venv .venv
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/python -m pip install -r requirements-dev.txt
        .venv/bin/python -m pip install -e .

    - name: Run tests
      shell: bash
      run: .venv/bin/python -m pytest
