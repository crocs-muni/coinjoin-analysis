name: Build and Push Docker Images to GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "data/**"
      - "docker/**"
      - "requirements.txt"
      - "setup.py"
      - ".dockerignore"
      - ".github/workflows/docker-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # Set the repository variable CI_RUNNER to a JSON array of runner labels
    # (for example ["self-hosted","x64"]) in repositories with a local runner.
    # Leave it unset in upstream to use GitHub's hosted Ubuntu runner.
    # This workflow only runs on trusted events (push to main, workflow_dispatch),
    # so it needs no fork guard.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set analysis image name
        id: image-name
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/coinjoin-analysis" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract analysis metadata
        id: analysis-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push coinjoin-analysis image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/analysis.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.analysis-meta.outputs.tags }}
          labels: ${{ steps.analysis-meta.outputs.labels }}
